name: lifemaxing
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifemaxing
      POSTGRES_USER: lifemaxing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemaxing -d lifemaxing"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  postgres18-data:
